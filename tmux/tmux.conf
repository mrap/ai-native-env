# .tmux.conf
# Updated 2026-03-18 — tmux makeover (q-119)
# Backup: tmux.conf.backup-2026-03-18

# ── Terminal & core ──────────────────────────────────────────────────────────
set -g default-command "${SHELL}"
set -g history-limit 500000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg terminal-overrides ",*:RGB"
set -ga allow-passthrough on
set -ga terminal-overrides ',*:allow-passthrough'
set -ga terminal-features 'xterm*:allow-passthrough'
set -g renumber-windows on
set -g escape-time 20
set -g mouse on
set -g focus-events on

# ── Indices ──────────────────────────────────────────────────────────────────
set-option -g base-index 1
set-window-option -g pane-base-index 1

# ── Prefix (unchanged) ──────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# ── Keybindings (unchanged) ─────────────────────────────────────────────────
bind a next-layout
bind C-Space last-window
bind c new-window -c "#{pane_current_path}"
bind-key ^V split-window -h -l 50% -c "#{pane_current_path}"
bind-key ^S split-window -l 50% -c "#{pane_current_path}"
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# ── Copy mode (vi, unchanged) ───────────────────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -selection clipboard'"
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi 'Enter' send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi 'Enter' send -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# ── Pane borders + active pane indicator ─────────────────────────────────────
set -g pane-border-lines heavy
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#1e66f5"

# Pane titles in the border — shows pane number + running command
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#1e66f5 bold],#[fg=#bcc0cc]}#{pane_index}: #{pane_current_command} "

# Focus hooks removed — they override terminal colors and force dark backgrounds.
# Active/inactive pane distinction handled by tmux-inactive-panes plugin (dims inactive)
# and pane border colors (blue active, gray inactive).

# ── Catppuccin theme (must be set BEFORE plugin runs) ────────────────────────
# set -g @catppuccin_flavor 'latte'
# set -g @catppuccin_window_status_style "rounded"
# set -g status-left " #[fg=#1e66f5,bold,bg=default] #S  "
# set -g status-right "#{E:@catppuccin_status_date_time}"
# set -g @catppuccin_status_date_time_text "%H:%M  %d %b"

# ── Rose Pine theme (must be set BEFORE plugin runs) ────────────────────────
set -g @rose_pine_variant 'dawn'
set -g @rose_pine_host 'on' # Enables hostname in the status bar
set -g @rose_pine_hostname_short 'on' # Makes the hostname shorter by using tmux's '#h' format
set -g @rose_pine_date_time '' # It accepts the date UNIX command format (man date for info)
set -g @rose_pine_user 'on' # Turn on the username component in the statusbar
set -g @rose_pine_directory 'on' # Turn on the current folder component in the status bar

set -g @rose_pine_bar_bg_disable 'on' # Disables background color, for transparent terminal emulators
# If @rose_pine_bar_bg_disable is set to 'on', uses the provided value to set the background color
# It can be any of the on tmux (named colors, 256-color set, `default` or hex colors)
# See more on http://man.openbsd.org/OpenBSD-current/man1/tmux.1#STYLES
set -g @rose_pine_bar_bg_disabled_color_option 'default'

# Some of these are mutually exclusive, recommended to test which one you like
set -g @rose_pine_only_windows 'on' # Leaves only the window module, for max focus and space
set -g @rose_pine_window_status_separator "  " # Changes the default icon that appears between window names
set -g @rose_pine_disable_active_window_menu 'on' # Disables the menu that shows the active window on the left
set -g @rose_pine_default_window_behavior 'on' # Forces tmux default window list behaviour

set -g @rose_pine_show_current_program 'on' # Forces tmux to show the current running program as window name
set -g @rose_pine_show_pane_directory 'on' # Forces tmux to show the current directory as window name
# Previously set -g @rose_pine_window_tabs_enabled

# Example values for these can be:
set -g @rose_pine_left_separator ' > ' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator ' < ' # Accepts both normal chars & nerdfont icons
set -g @rose_pine_field_separator '  ' # Default is two-space-padded, but can be set to anything
set -g @rose_pine_window_separator ' - ' # Replaces the default `:` between the window number and name

# These are not padded
set -g @rose_pine_session_icon '' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '' # Changes the default icon to the left of the active window name
set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon '' # Changes the default icon to the right of the hostname
set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname
set -g @rose_pine_date_time_icon '󰃰' # Changes the default icon to the right of the date module

# Very beta and specific opt-in settings, tested on v3.2a, look at issue #10
set -g @rose_pine_prioritize_windows 'on' # Disables the right side functionality in a certain window count / terminal width
set -g @rose_pine_width_to_hide '80' # Specify a terminal width to toggle off most of the right side functionality
set -g @rose_pine_window_count '5' # Specify a number of windows, if there are more than the number, do the same as width_to_hide


# ── Status bar ───────────────────────────────────────────────────────────────
# Session name prominent at top-left, date/time on the right
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-right-length 100
set -g status-left-length 100

# ── sesh: session switcher (prefix+t to pick, prefix+s to toggle last) ──────
bind-key "t" run-shell "bash ~/.config/tmux/sesh-picker.sh"
bind-key "C-t" run-shell "bash ~/.config/tmux/sesh-picker.sh"
bind-key "s" run-shell "sesh last"
bind-key "C-s" split-window -l 50% -c "#{pane_current_path}"
bind-key "l" switch-client -l

# ── tmux-thumbs: rebind to prefix+F to avoid conflict with send-prefix ──────
set -g @thumbs-key F

# ── TPM bootstrap (unchanged) ───────────────────────────────────────────────
if-shell -b '[ ! -d "${XDG_CONFIG_HOME:-$HOME/.config}"/tmux/plugins/tpm ]' \
    'run "d=${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm; mkdir -p $d && git clone https://github.com/tmux-plugins/tpm $d && $d/bin/install_plugins"'

# ── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'                    # NEW: theme (fixes @thm_* vars)
set -g @plugin 'fcsonline/tmux-thumbs'              # NEW: hint-copy (prefix+F)
set -g @plugin 'jtbairdsr/tmux-inactive-panes'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-copycat'

# ── nvim-tmux-navigation: seamless C-hjkl between nvim splits & tmux panes ──
# Replaces christoomey/vim-tmux-navigator's tmux half. nvim half is the
# alexghergh/nvim-tmux-navigation plugin (see nvim/init.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

run '~/.config/tmux/plugins/tpm/tpm'
